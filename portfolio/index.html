<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ars Exidens</title>
    <style>
        *{
            box-sizing: border-box;
        }
        body{
            margin: 0;
            padding: 0;
        }
        .login__box{
            width: 100dvw;
            height: 100dvh;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: 1rem;
        }
        .login__box{
            display: flex;
            flex-direction: row;
            gap: 0.5rem;
        }
        .login__input{
            border: 1px solid #ccc;
            color: black;
            font-size: 1rem;
            padding: 0.5rem;
            border-radius: 0.25rem;
        }
        .login__button{
            border: 1px solid #ccc;
            background-color: aqua;
            font-size: 1rem;
            padding: 0.5rem;
            border-radius: 0.25rem;
        }
        .logo{
            position: fixed;
            top: 1rem;
            left: 1rem;
            width: 200px;
        }
    </style>
</head>
<body>
    <img src="../img/logo.svg" alt="Ars Exidens" class="logo">
    <div class="login__container">
        <div class="login__box">
            <input type="password" id="password" placeholder="Password" class="login__input">
            <button onclick="login()" class="login__button">OK</button>
        </div>
    </div>
    <script>
        // we know it's not secure... it's ok... enjoy our portfolio ;)
        async function login() {
            const password = document.getElementById('password').value;
            const msgBuffer = new TextEncoder().encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            window.location.href = "../" + hashHex + "/private.html";
        }
        </script>
</body>
</html>
